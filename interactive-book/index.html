<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Veil Protocol — Campaign Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500&display=swap">
<style>
:root {
  --bg: #0a0a0f;
  --surface: #12121a;
  --card: #1a1a26;
  --border: #2a2a3e;
  --border-accent: #3d3d5c;
  --text: #d4d0e8;
  --text-dim: #8a8aaa;
  --text-faint: #4a4a6a;
  --accent: #7a6fa8;
  --accent-bright: #9d8fd6;
  --blood: #8b1a1a;
  --blood-bright: #c0392b;
  --gold: #b8960c;
  --gold-bright: #d4a017;
  --teal: #2a6a6a;
  --teal-bright: #3d9a9a;
  --font-header: 'Special Elite', 'Courier New', monospace;
  --font-body: 'Crimson Pro', Georgia, serif;
  --font-ui: 'Inter', system-ui, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.75;
  min-height: 100%;
}

body {
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) 0;
}

/* ── Layout ── */
.site-header {
  padding: 2.5rem 1.25rem 1.5rem;
  text-align: center;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, #05050a 0%, var(--bg) 100%);
}

.site-title {
  font-family: var(--font-header);
  font-size: clamp(1.6rem, 5vw, 2.8rem);
  letter-spacing: 0.18em;
  color: var(--text);
  text-transform: uppercase;
  margin-bottom: 0.4rem;
}

.site-subtitle {
  font-family: var(--font-ui);
  font-size: 0.7rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--text-faint);
}

/* ── Tab nav ── */
.tab-nav {
  display: flex;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 100;
}
.tab-nav::-webkit-scrollbar { display: none; }

.tab-btn {
  flex: 0 0 auto;
  padding: 0.85rem 1.2rem;
  font-family: var(--font-header);
  font-size: 0.72rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-faint);
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  white-space: nowrap;
  transition: color 0.2s, border-color 0.2s;
}
.tab-btn:hover { color: var(--text-dim); }
.tab-btn.active {
  color: var(--accent-bright);
  border-bottom-color: var(--accent-bright);
}

/* ── Tab panels ── */
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── Content wrapper ── */
.content {
  max-width: 820px;
  margin: 0 auto;
  padding: 2rem 1.25rem 4rem;
}

/* ── Typography ── */
h1, h2, h3, h4 { font-family: var(--font-header); font-weight: normal; text-wrap: balance; }

h2 {
  font-size: clamp(1.1rem, 3vw, 1.45rem);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text);
  margin-bottom: 1.2rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--border);
}

h3 {
  font-size: 1.05rem;
  letter-spacing: 0.08em;
  color: var(--accent-bright);
  margin-bottom: 0.6rem;
  margin-top: 1.8rem;
}

h4 {
  font-size: 0.85rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 0.4rem;
  margin-top: 1.2rem;
}

p { margin-bottom: 0.9rem; }
p:last-child { margin-bottom: 0; }

em { color: var(--text-dim); font-style: italic; }

.label {
  font-family: var(--font-ui);
  font-size: 0.65rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-faint);
}

/* ── Cards ── */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1.4rem;
  margin-bottom: 1.2rem;
}

.card-accent {
  border-left: 3px solid var(--accent);
}

.card-blood {
  border-left: 3px solid var(--blood-bright);
}

.card-gold {
  border-left: 3px solid var(--gold);
}

.card-teal {
  border-left: 3px solid var(--teal-bright);
}

/* ── Quote block ── */
.quote-block {
  font-family: var(--font-header);
  font-size: 0.95rem;
  line-height: 1.65;
  color: var(--text-dim);
  border-left: 2px solid var(--border-accent);
  padding-left: 1rem;
  margin: 1rem 0;
  font-style: italic;
}

.quote-attr {
  font-family: var(--font-ui);
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin-top: 0.5rem;
  font-style: normal;
}

/* ── Section divider ── */
.section { margin-bottom: 3rem; }

.divider {
  border: none;
  border-top: 1px solid var(--border);
  margin: 2rem 0;
}

/* ── Character grid ── */
.char-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1rem;
}

@media (max-width: 480px) {
  .char-grid { grid-template-columns: 1fr; }
}

.char-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1.2rem;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
}

.char-card:hover {
  border-color: var(--border-accent);
  background: #1e1e2e;
}

.char-card.expanded {
  grid-column: 1 / -1;
  border-color: var(--accent);
}

.char-name {
  font-family: var(--font-header);
  font-size: 1rem;
  letter-spacing: 0.06em;
  color: var(--text);
  margin-bottom: 0.25rem;
}

.char-role {
  font-family: var(--font-ui);
  font-size: 0.65rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin-bottom: 0.7rem;
}

.char-cap {
  font-family: var(--font-header);
  font-size: 0.85rem;
  color: var(--text-dim);
  font-style: italic;
  line-height: 1.5;
}

.char-details { display: none; margin-top: 1rem; }
.char-card.expanded .char-details { display: block; }

.char-tag {
  display: inline-block;
  font-family: var(--font-ui);
  font-size: 0.6rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  padding: 0.15rem 0.5rem;
  border-radius: 2px;
  margin: 0.2rem 0.2rem 0 0;
}

.tag-romance { background: rgba(139, 26, 26, 0.3); color: var(--blood-bright); border: 1px solid var(--blood); }
.tag-minor { background: rgba(74, 74, 106, 0.3); color: var(--text-faint); border: 1px solid var(--border); }
.tag-entity { background: rgba(42, 106, 106, 0.3); color: var(--teal-bright); border: 1px solid var(--teal); }
.tag-antagonist { background: rgba(122, 111, 168, 0.2); color: var(--accent-bright); border: 1px solid var(--accent); }
.tag-key { background: rgba(184, 150, 12, 0.2); color: var(--gold-bright); border: 1px solid var(--gold); }

/* ── Domain cards ── */
.domain-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 1rem;
}

@media (max-width: 480px) {
  .domain-grid { grid-template-columns: 1fr; }
}

.domain-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1.2rem;
}

.domain-number {
  font-family: var(--font-header);
  font-size: 0.65rem;
  letter-spacing: 0.2em;
  color: var(--text-faint);
  text-transform: uppercase;
  margin-bottom: 0.3rem;
}

.domain-name {
  font-family: var(--font-header);
  font-size: 1.05rem;
  letter-spacing: 0.08em;
  color: var(--accent-bright);
  margin-bottom: 0.2rem;
}

.domain-emotion {
  font-family: var(--font-ui);
  font-size: 0.7rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.15em;
  margin-bottom: 0.7rem;
}

.domain-holder {
  font-family: var(--font-body);
  font-size: 0.9rem;
  color: var(--text);
}

.domain-status {
  font-family: var(--font-ui);
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-top: 0.5rem;
  padding: 0.2rem 0.5rem;
  border-radius: 2px;
  display: inline-block;
}

.status-stable { background: rgba(42, 106, 42, 0.2); color: #4a9a4a; border: 1px solid #2a4a2a; }
.status-watch { background: rgba(184, 150, 12, 0.2); color: var(--gold-bright); border: 1px solid var(--gold); }
.status-critical { background: rgba(139, 26, 26, 0.3); color: var(--blood-bright); border: 1px solid var(--blood); }
.status-vacant { background: rgba(139, 26, 26, 0.5); color: #ff4444; border: 1px solid #aa2222; }

/* ── Bestiary ── */
.entity-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1.3rem;
  margin-bottom: 1rem;
}

.entity-grade {
  font-family: var(--font-ui);
  font-size: 0.65rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-faint);
  margin-bottom: 0.25rem;
}

.grade-e { color: #5a8a5a; }
.grade-d { color: var(--teal-bright); }
.grade-c { color: var(--gold-bright); }
.grade-b { color: var(--accent-bright); }
.grade-a { color: var(--blood-bright); }
.grade-ss { color: #ff6666; }
.grade-top { color: #ff6666; }

.entity-name {
  font-family: var(--font-header);
  font-size: 1.05rem;
  letter-spacing: 0.08em;
  color: var(--text);
  margin-bottom: 0.2rem;
}

.entity-register {
  font-family: var(--font-ui);
  font-size: 0.65rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.15em;
  margin-bottom: 0.75rem;
}

/* ── Road cards ── */
.road-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1.4rem;
  margin-bottom: 1rem;
}

.road-name {
  font-family: var(--font-header);
  font-size: 0.9rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gold-bright);
  margin-bottom: 0.4rem;
}

/* ── Venue grid ── */
.venue-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 0.8rem;
}

@media (max-width: 480px) {
  .venue-grid { grid-template-columns: 1fr; }
}

.venue-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1rem;
}

.venue-name {
  font-family: var(--font-header);
  font-size: 0.85rem;
  letter-spacing: 0.06em;
  color: var(--text);
  margin-bottom: 0.15rem;
}

.venue-keeper {
  font-family: var(--font-ui);
  font-size: 0.65rem;
  color: var(--text-faint);
  letter-spacing: 0.1em;
}

/* ── System table ── */
.system-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.9rem;
  margin-bottom: 1.5rem;
  overflow-x: auto;
  display: block;
}

.system-table th {
  font-family: var(--font-ui);
  font-size: 0.6rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-faint);
  text-align: left;
  padding: 0.5rem 0.8rem;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

.system-table td {
  padding: 0.55rem 0.8rem;
  border-bottom: 1px solid var(--border);
  color: var(--text-dim);
  vertical-align: top;
}

.system-table tr:last-child td { border-bottom: none; }

.system-table td:first-child {
  font-family: var(--font-header);
  letter-spacing: 0.06em;
  color: var(--text);
  white-space: nowrap;
}

/* ── Intro block ── */
.intro-block {
  background: linear-gradient(180deg, #0e0e18 0%, var(--card) 100%);
  border: 1px solid var(--border-accent);
  border-radius: 3px;
  padding: 2rem 1.5rem;
  margin-bottom: 2.5rem;
  text-align: center;
}

.intro-block p {
  font-family: var(--font-body);
  font-size: 1.05rem;
  color: var(--text-dim);
  line-height: 1.8;
  max-width: 640px;
  margin: 0 auto 0.9rem;
}

.intro-block p:last-child { margin-bottom: 0; }

/* ── Warning block ── */
.warning-block {
  background: rgba(139, 26, 26, 0.12);
  border: 1px solid var(--blood);
  border-radius: 3px;
  padding: 1rem 1.3rem;
  margin: 1.5rem 0;
  font-family: var(--font-ui);
  font-size: 0.78rem;
  color: var(--blood-bright);
  letter-spacing: 0.05em;
}

/* ── Spoiler collapse ── */
.spoiler-trigger {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  cursor: pointer;
  font-family: var(--font-ui);
  font-size: 0.7rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--blood-bright);
  border: 1px solid var(--blood);
  background: rgba(139,26,26,0.1);
  padding: 0.5rem 0.9rem;
  border-radius: 2px;
  margin-bottom: 0;
  width: 100%;
  text-align: left;
}

.spoiler-trigger::after { content: '▸'; transition: transform 0.2s; margin-left: auto; }
.spoiler-trigger.open::after { transform: rotate(90deg); }

.spoiler-body {
  display: none;
  background: rgba(139, 26, 26, 0.07);
  border: 1px solid var(--blood);
  border-top: none;
  padding: 1.2rem;
  margin-bottom: 1.2rem;
}

.spoiler-body.visible { display: block; }

/* ── Misc ── */
.stat-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 0.3rem 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.88rem;
}

.stat-row:last-child { border-bottom: none; }

.stat-label {
  font-family: var(--font-ui);
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--text-faint);
}

.stat-value {
  font-family: var(--font-header);
  font-size: 0.88rem;
  color: var(--text);
}

.prose-block {
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.85;
  color: var(--text-dim);
}

.prose-block + .prose-block { margin-top: 1rem; }

.fingerprint {
  font-family: var(--font-ui);
  font-size: 0.6rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-faint);
  text-align: center;
  padding: 2rem 0 0.5rem;
}

/* ── Loading state ── */
.loading-state {
  font-family: var(--font-ui);
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-faint);
  text-align: center;
  padding: 4rem 1rem;
}

.error-state {
  font-family: var(--font-ui);
  font-size: 0.8rem;
  color: var(--blood-bright);
  text-align: center;
  padding: 3rem 1rem;
}
</style>
</head>
<body>

<header class="site-header">
  <div class="site-title">Veil Protocol</div>
  <div class="site-subtitle">Campaign Archive &mdash; Kita District, Tokyo</div>
</header>

<nav class="tab-nav" role="tablist" aria-label="Archive sections">
  <button class="tab-btn active" data-tab="archive" role="tab" aria-selected="true">The Archive</button>
  <button class="tab-btn" data-tab="chapter1" role="tab" aria-selected="false">Chapter One</button>
  <button class="tab-btn" data-tab="characters" role="tab" aria-selected="false">Characters</button>
  <button class="tab-btn" data-tab="thirteen" role="tab" aria-selected="false">The Thirteen</button>
  <button class="tab-btn" data-tab="bestiary" role="tab" aria-selected="false">Bestiary</button>
  <button class="tab-btn" data-tab="city" role="tab" aria-selected="false">The City</button>
  <button class="tab-btn" data-tab="system" role="tab" aria-selected="false">The System</button>
</nav>

<section class="tab-panel active" id="tab-archive" role="tabpanel">
  <div class="content"><div class="loading-state">Loading archive...</div></div>
</section>

<section class="tab-panel" id="tab-chapter1" role="tabpanel">
  <div class="content"><div class="loading-state">Loading chapter...</div></div>
</section>

<section class="tab-panel" id="tab-characters" role="tabpanel">
  <div class="content"><div class="loading-state">Loading characters...</div></div>
</section>

<section class="tab-panel" id="tab-thirteen" role="tabpanel">
  <div class="content"><div class="loading-state">Loading domains...</div></div>
</section>

<section class="tab-panel" id="tab-bestiary" role="tabpanel">
  <div class="content"><div class="loading-state">Loading bestiary...</div></div>
</section>

<section class="tab-panel" id="tab-city" role="tabpanel">
  <div class="content"><div class="loading-state">Loading city data...</div></div>
</section>

<section class="tab-panel" id="tab-system" role="tabpanel">
  <div class="content"><div class="loading-state">Loading system data...</div></div>
</section>

<!-- Tab switching -->
<script>
(function () {
  var btns = document.querySelectorAll('.tab-btn');
  var panels = document.querySelectorAll('.tab-panel');
  btns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var target = btn.dataset.tab;
      btns.forEach(function (b) { b.classList.remove('active'); b.setAttribute('aria-selected', 'false'); });
      panels.forEach(function (p) { p.classList.remove('active'); });
      btn.classList.add('active');
      btn.setAttribute('aria-selected', 'true');
      document.getElementById('tab-' + target).classList.add('active');
    });
  });
})();
</script>

<!-- Initialize VP namespace before content scripts run -->
<script>
window.VP = { scenes: {}, branchText: {}, actions: {} };
</script>

<!-- Content modules -->
<script src="../content/scenes/chapter1.js"></script>
<script src="../content/lore/branch_text.js"></script>

<!-- Main render script -->
<script>
(function () {

/* ── helpers ── */
function el(tag, cls, html) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}

function setContent(panelId, node) {
  var panel = document.getElementById(panelId);
  var wrap = panel.querySelector('.content');
  wrap.innerHTML = '';
  if (typeof node === 'string') { wrap.innerHTML = node; }
  else { wrap.appendChild(node); }
}

function showError(panelId, msg) {
  setContent(panelId, '<div class="error-state">' + msg + '</div>');
}

function paragraphs(arr) {
  if (!arr) return '';
  return arr.map(function (t) {
    if (t.trim().startsWith('<p')) return t;
    return '<p>' + t + '</p>';
  }).join('');
}

/* ── renderArchive ── */
function renderArchive(artifacts) {
  var frag = document.createDocumentFragment();
  var sections = Object.keys(artifacts);
  sections.forEach(function (key) {
    var val = artifacts[key];
    // skip embedded base64 sections (Primary Field Materials contains huge data)
    if (typeof val !== 'string') return;
    // strip trailing base64 blobs but keep prose
    var prose = val.replace(/data:image\/[^;]+;base64,[A-Za-z0-9+/=]{100,}/g, '[image]');

    var sec = el('div', 'section');
    var h2 = el('h2', '', key);
    sec.appendChild(h2);

    // split on double newlines into paragraphs
    var parts = prose.split(/\n\n+/);
    var block = el('div', 'prose-block');
    parts.forEach(function (p) {
      if (p.trim()) {
        var pe = el('p', '', p.trim());
        block.appendChild(pe);
      }
    });
    sec.appendChild(block);
    frag.appendChild(sec);
  });

  var fp = el('p', 'fingerprint', 'Veil Protocol &mdash; Field Reference &mdash; Restricted');
  frag.appendChild(fp);
  setContent('tab-archive', frag);
}

/* ── renderChapter1 ── */
function renderChapter1() {
  var sc = window.VP.scenes;
  var bt = window.VP.branchText;

  if (!sc || !sc.opening || !sc.opening.length) {
    showError('tab-chapter1', 'Chapter one scenes not loaded.');
    return;
  }

  var frag = document.createDocumentFragment();

  // Opening prose
  var sec1 = el('div', 'section');
  sec1.appendChild(el('h2', '', 'Chapter One &mdash; The Opening'));

  var intro = el('div', 'intro-block');
  var op = sc.opening[0];
  if (op && op.t) {
    op.t.forEach(function (para) {
      var p = el('p', '');
      p.innerHTML = para.replace(/<\/?p[^>]*>/g, '');
      intro.appendChild(p);
    });
  }
  sec1.appendChild(intro);

  // Oji slope scene
  var ojiScene = sc.opening[6];
  if (ojiScene && ojiScene.t) {
    sec1.appendChild(el('h3', '', 'The Slope to &#332;ji'));
    var ojiBlock = el('div', 'prose-block');
    ojiScene.t.forEach(function (t) {
      var p = el('p', '');
      p.innerHTML = t.replace(/<\/?p[^>]*>/g, '');
      ojiBlock.appendChild(p);
    });
    sec1.appendChild(ojiBlock);
  }

  // The Lingering
  var lingScene = sc.opening[7];
  if (lingScene && lingScene.t) {
    sec1.appendChild(el('h3', '', 'The Overpass'));
    var lingBlock = el('div', 'prose-block');
    lingScene.t.forEach(function (t) {
      var p = el('p', '');
      p.innerHTML = t.replace(/<\/?p[^>]*>/g, '');
      lingBlock.appendChild(p);
    });
    // entity block if present
    if (lingScene.ent) {
      var ent = lingScene.ent;
      var eCard = el('div', 'card card-teal');
      eCard.appendChild(el('div', 'entity-grade grade-e', 'Entity encountered'));
      eCard.appendChild(el('div', 'entity-name', ent.name));
      eCard.appendChild(el('div', 'entity-register', ent.kind));
      if (ent.rows) {
        ent.rows.forEach(function (row) {
          var sr = el('div', 'stat-row');
          sr.appendChild(el('span', 'stat-label', row[0]));
          sr.appendChild(el('span', 'stat-value', row[1]));
          eCard.appendChild(sr);
        });
      }
      sec1.appendChild(eCard);
    }
    sec1.appendChild(lingBlock);
  }

  frag.appendChild(sec1);

  // Five Roads
  var sec2 = el('div', 'section');
  sec2.appendChild(el('h2', '', 'The Five Roads'));

  var roadDefs = [
    { key: 'grid',  label: 'The Grid',          hint: 'Gin\'s book of unregistered names.' },
    { key: 'cvd',   label: 'The CVD',            hint: 'Report him. Let the Directorate make you theirs.' },
    { key: 'buddy', label: 'Call Itsuki',        hint: 'Your oldest friend, a Kuroda, awake at the worst hour.' },
    { key: 'power', label: 'The Gift',           hint: 'The thing you are not supposed to do. Costly.' },
    { key: 'look',  label: 'Just Go Out',        hint: 'No name, no power, no institution. Only attention.' }
  ];

  roadDefs.forEach(function (def) {
    var card = el('div', 'road-card');
    card.appendChild(el('div', 'road-name', def.label));
    if (def.hint) {
      card.appendChild(el('p', 'label', def.hint));
    }
    var text = bt[def.key];
    if (text) {
      var p = el('p', 'prose-block');
      p.style.marginTop = '0.7rem';
      p.textContent = text;
      card.appendChild(p);
    }
    sec2.appendChild(card);
  });

  frag.appendChild(sec2);

  // Road summaries from scene arrays
  var roadScenes = [
    { key: 'itsuki', label: 'Road: Itsuki' },
    { key: 'grid',   label: 'Road: The Grid' },
    { key: 'cvd',    label: 'Road: The CVD' },
    { key: 'power',  label: 'Road: The Gift' },
    { key: 'look',   label: 'Road: The Long Way' }
  ];

  roadScenes.forEach(function (rs) {
    var scenes = sc[rs.key];
    if (!scenes || !scenes[0]) return;
    var first = scenes[0];
    if (!first.t) return;

    var sec = el('div', 'section');
    sec.appendChild(el('h3', '', rs.label));
    var block = el('div', 'prose-block');
    first.t.slice(0, 2).forEach(function (t) {
      var p = el('p', '');
      p.innerHTML = t.replace(/<\/?p[^>]*>/g, '');
      block.appendChild(p);
    });
    sec.appendChild(block);
    frag.appendChild(sec);
  });

  frag.appendChild(el('p', 'fingerprint', 'Chapter One &mdash; Five Roads'));
  setContent('tab-chapter1', frag);
}

/* ── renderCharacters ── */
var TAG_KEY        = ['rei', 'gin'];
var TAG_ROMANCE    = ['usami_ren', 'kuroda_itsuki', 'hagiwara_mizuki', 'nakamura_aoi', 'kato_ryusei', 'katagiri_noa', 'moriya', 'okada_shizuka'];
var TAG_MINOR      = ['mori_haruto', 'yua'];
var TAG_ENTITY     = ['yushiro', 'usami_ren'];
var TAG_ANTAGONIST = ['yushiro', 'kishin'];

function charTags(id) {
  var tags = [];
  if (TAG_KEY.indexOf(id) > -1)        tags.push(['tag-key',        'Key']);
  if (TAG_ROMANCE.indexOf(id) > -1)    tags.push(['tag-romance',    'Romance']);
  if (TAG_MINOR.indexOf(id) > -1)      tags.push(['tag-minor',      'Minor']);
  if (TAG_ENTITY.indexOf(id) > -1)     tags.push(['tag-entity',     'Entity']);
  if (TAG_ANTAGONIST.indexOf(id) > -1) tags.push(['tag-antagonist', 'Antagonist']);
  return tags;
}

function renderCharacters(authored) {
  var frag = document.createDocumentFragment();
  frag.appendChild(el('h2', '', 'Cast'));

  var grid = el('div', 'char-grid');

  Object.keys(authored).forEach(function (id) {
    var c = authored[id];
    var card = el('div', 'char-card');
    card.dataset.id = id;

    // Name and role from meta ("Name · Role" format)
    var meta = c.meta || '';
    var metaParts = meta.split('·');
    var name = metaParts[0] ? metaParts[0].trim() : id;
    var role = metaParts[1] ? metaParts[1].trim() : '';

    card.appendChild(el('div', 'char-name', name));
    if (role) card.appendChild(el('div', 'char-role', role));

    // Caption
    var cap = c.cap || '';
    if (cap) {
      var capEl = el('div', 'char-cap', cap.replace(/\n/g, '<br>'));
      card.appendChild(capEl);
    }

    // Tags
    var tags = charTags(id);
    if (tags.length) {
      var tagRow = el('div', '');
      tagRow.style.marginTop = '0.6rem';
      tags.forEach(function (t) {
        tagRow.appendChild(el('span', 'char-tag ' + t[0], t[1]));
      });
      card.appendChild(tagRow);
    }

    // Expandable details
    var details = el('div', 'char-details');

    // Background
    if (c.back && c.back.length) {
      var backDiv = el('div', 'prose-block');
      c.back.forEach(function (para) {
        backDiv.appendChild(el('p', '', para));
      });
      details.appendChild(backDiv);
    }

    // Relationships
    if (c.rels && c.rels.length) {
      details.appendChild(el('h4', '', 'Relationships'));
      c.rels.forEach(function (rel) {
        var sr = el('div', 'stat-row');
        var score = parseInt(rel[1], 10);
        var scoreStr = (score > 0 ? '+' : '') + score;
        sr.appendChild(el('span', 'stat-label', rel[0]));
        var right = el('span', '');
        right.style.display = 'flex';
        right.style.gap = '0.5rem';
        right.style.alignItems = 'baseline';
        right.appendChild(el('span', 'stat-value', scoreStr));
        if (rel[2]) {
          var desc = el('span', '');
          desc.style.fontFamily = 'var(--font-body)';
          desc.style.fontSize = '0.8rem';
          desc.style.color = 'var(--text-faint)';
          desc.textContent = rel[2];
          right.appendChild(desc);
        }
        sr.appendChild(right);
        details.appendChild(sr);
      });
    }

    // Quest hook
    if (c.quest && c.quest.hook) {
      details.appendChild(el('h4', '', c.quest.title || 'Quest'));
      details.appendChild(el('p', 'prose-block', c.quest.hook));
    }

    card.appendChild(details);
    grid.appendChild(card);
  });

  frag.appendChild(grid);

  // Expand/collapse via delegation on the grid
  grid.addEventListener('click', function (e) {
    var card = e.target.closest('.char-card');
    if (!card) return;
    var wasExpanded = card.classList.contains('expanded');
    grid.querySelectorAll('.char-card.expanded').forEach(function (c) {
      c.classList.remove('expanded');
    });
    if (!wasExpanded) card.classList.add('expanded');
  });

  frag.appendChild(el('p', 'fingerprint', 'Veil Protocol &mdash; Cast Registry'));
  setContent('tab-characters', frag);
}

/* ── renderThirteen ── */
function renderThirteen(domains, xiii) {
  var frag = document.createDocumentFragment();
  frag.appendChild(el('h2', '', 'The Thirteen Domains'));

  // Axis description
  if (domains.axis) {
    var axisCard = el('div', 'card card-accent');
    axisCard.appendChild(el('p', 'label', 'The Axis'));
    axisCard.appendChild(el('p', 'prose-block', domains.axis));
    frag.appendChild(axisCard);
  }

  var grid = el('div', 'domain-grid');

  (domains.domains || []).forEach(function (d) {
    var card = el('div', 'domain-card');
    card.appendChild(el('div', 'domain-number', 'Domain ' + d.numeral));
    card.appendChild(el('div', 'domain-name', d.domain));
    card.appendChild(el('div', 'domain-emotion', d.emotion));
    card.appendChild(el('div', 'domain-holder', d.holder || 'Holder unknown'));

    // Status badge
    var raw = (d.status || '').toUpperCase();
    var cls = 'domain-status status-watch';
    if (raw.indexOf('STABLE') > -1) cls = 'domain-status status-stable';
    else if (raw.indexOf('CRITICAL') > -1) cls = 'domain-status status-critical';
    else if (raw.indexOf('VACANT') > -1 || raw.indexOf('EMPTY') > -1) cls = 'domain-status status-vacant';

    card.appendChild(el('span', cls, d.status || ''));

    if (d.location) {
      var loc = el('p', '');
      loc.style.fontFamily = 'var(--font-ui)';
      loc.style.fontSize = '0.65rem';
      loc.style.color = 'var(--text-faint)';
      loc.style.letterSpacing = '0.1em';
      loc.style.marginTop = '0.5rem';
      loc.textContent = d.location;
      card.appendChild(loc);
    }

    grid.appendChild(card);
  });

  frag.appendChild(grid);

  // Domain XIII spoiler
  if (xiii) {
    var hr = el('hr', 'divider');
    frag.appendChild(hr);

    frag.appendChild(el('h2', '', 'Domain XIII &mdash; Duty'));

    var warningEl = el('div', 'warning-block', 'Warden-level content. Contains unresolved succession and active destabilization data.');
    frag.appendChild(warningEl);

    var triggerEl = el('button', 'spoiler-trigger');
    triggerEl.id = 'spoilerBtn';
    triggerEl.textContent = 'Unlock Domain XIII Archive';
    frag.appendChild(triggerEl);

    var bodyEl = el('div', 'spoiler-body');
    bodyEl.id = 'spoilerBody';

    // Tagline
    if (xiii.tagline) {
      var tl = el('div', 'quote-block', '"' + xiii.tagline + '"');
      bodyEl.appendChild(tl);
    }

    // Essence
    if (xiii.essence) {
      bodyEl.appendChild(el('h3', '', 'Essence'));
      bodyEl.appendChild(el('p', 'prose-block', xiii.essence));
    }

    // Status
    if (xiii.status) {
      bodyEl.appendChild(el('h3', '', 'Current Status'));
      bodyEl.appendChild(el('p', 'prose-block', xiii.status));
    }

    // Destabilization track
    if (xiii.destabilization_track) {
      bodyEl.appendChild(el('h3', '', 'Destabilization Track'));
      var dtVal = xiii.destabilization_track;
      if (typeof dtVal === 'string') {
        bodyEl.appendChild(el('p', 'prose-block', dtVal));
      } else if (Array.isArray(dtVal)) {
        dtVal.forEach(function (step) {
          bodyEl.appendChild(el('p', 'prose-block', typeof step === 'string' ? step : JSON.stringify(step)));
        });
      }
    }

    // Axis link
    if (xiii.axis_link) {
      bodyEl.appendChild(el('h3', '', 'Axis Link'));
      bodyEl.appendChild(el('p', 'prose-block', xiii.axis_link));
    }

    // Warden notes
    if (xiii.warden_notes) {
      bodyEl.appendChild(el('h3', '', 'Warden Notes'));
      var wnVal = xiii.warden_notes;
      if (typeof wnVal === 'string') {
        bodyEl.appendChild(el('p', 'prose-block', wnVal));
      } else if (Array.isArray(wnVal)) {
        wnVal.forEach(function (n) {
          bodyEl.appendChild(el('p', 'prose-block', typeof n === 'string' ? n : JSON.stringify(n)));
        });
      }
    }

    frag.appendChild(bodyEl);

    // Spoiler toggle (attach after both are in fragment)
    triggerEl.addEventListener('click', function () {
      triggerEl.classList.toggle('open');
      bodyEl.classList.toggle('visible');
    });
  }

  frag.appendChild(el('p', 'fingerprint', 'The Thirteen &mdash; Domain Registry'));
  setContent('tab-thirteen', frag);
}

/* ── renderBestiary ── */
function gradeClass(g) {
  var gm = { E: 'grade-e', D: 'grade-d', C: 'grade-c', B: 'grade-b', A: 'grade-a', S: 'grade-a', SS: 'grade-ss' };
  return gm[g] || 'grade-top';
}

function renderBestiary(bestiary) {
  var frag = document.createDocumentFragment();
  frag.appendChild(el('h2', '', 'Entity Register'));

  var intro = el('p', 'prose-block');
  intro.style.marginBottom = '1.5rem';
  intro.textContent = 'Entities encountered or documented during Chapter One. Sorted by threat tier.';
  frag.appendChild(intro);

  (bestiary || []).forEach(function (e) {
    var card = el('div', 'entity-card');

    var gradeStr = 'Grade ' + e.grade + (e.type ? ' · ' + e.type : '');
    var gradeEl = el('div', 'entity-grade ' + gradeClass(e.grade), gradeStr);
    card.appendChild(gradeEl);

    card.appendChild(el('div', 'entity-name', e.name));

    if (e.register) {
      card.appendChild(el('div', 'entity-register', 'Register: ' + e.register));
    }

    var stats = [
      ['HP', e.hp],
      ['ATK', e.atk],
      ['Exorcise DC', e.exorciseDC],
      ['Absorb', e.absorb],
      ['Anchor', e.anchor]
    ];
    stats.forEach(function (s) {
      if (s[1] == null || s[1] === '') return;
      var sr = el('div', 'stat-row');
      sr.appendChild(el('span', 'stat-label', s[0]));
      sr.appendChild(el('span', 'stat-value', String(s[1])));
      card.appendChild(sr);
    });

    if (e.tip) {
      var tip = el('p', '');
      tip.style.fontFamily = 'var(--font-body)';
      tip.style.fontStyle = 'italic';
      tip.style.fontSize = '0.9rem';
      tip.style.color = 'var(--text-faint)';
      tip.style.marginTop = '0.75rem';
      tip.textContent = e.tip;
      card.appendChild(tip);
    }

    frag.appendChild(card);
  });

  frag.appendChild(el('p', 'fingerprint', 'Veil Protocol &mdash; Entity Register'));
  setContent('tab-bestiary', frag);
}

/* ── renderCity ── */
function renderCity(places) {
  var frag = document.createDocumentFragment();
  frag.appendChild(el('h2', '', 'Kita District'));

  // District prose
  var prose = places.district_prose || {};
  Object.keys(prose).forEach(function (distName) {
    var sec = el('div', 'section');
    sec.appendChild(el('h3', '', distName));
    var text = prose[distName];
    var parts = (text || '').split(/\n\n+/);
    var block = el('div', 'prose-block');
    parts.forEach(function (p) {
      if (p.trim()) block.appendChild(el('p', '', p.trim()));
    });
    sec.appendChild(block);
    frag.appendChild(sec);
  });

  // Venues
  var venues = places.venues || {};
  var venueKeys = Object.keys(venues);
  if (venueKeys.length) {
    frag.appendChild(el('h2', '', 'Known Venues'));
    var grid = el('div', 'venue-grid');
    venueKeys.forEach(function (vName) {
      var keeper = venues[vName];
      var card = el('div', 'venue-card');
      card.appendChild(el('div', 'venue-name', vName));
      if (keeper) card.appendChild(el('div', 'venue-keeper', 'Keeper: ' + keeper));
      grid.appendChild(card);
    });
    frag.appendChild(grid);
  }

  frag.appendChild(el('p', 'fingerprint', 'Veil Protocol &mdash; City Reference'));
  setContent('tab-city', frag);
}

/* ── renderSystem ── */
function renderSystem(tiers) {
  var frag = document.createDocumentFragment();
  frag.appendChild(el('h2', '', 'Ability Registry'));

  var intro = el('p', 'prose-block');
  intro.style.marginBottom = '1.5rem';
  intro.textContent = 'Recorded tiers and active paths by character. Presented status reflects what is known at the start of Chapter One.';
  frag.appendChild(intro);

  var table = el('table', 'system-table');
  var thead = el('thead', '');
  var hrow = el('tr', '');
  ['Character', 'Class', 'Tier', 'Letter', 'Paths'].forEach(function (h) {
    hrow.appendChild(el('th', '', h));
  });
  thead.appendChild(hrow);
  table.appendChild(thead);

  var tbody = el('tbody', '');

  Object.keys(tiers).forEach(function (id) {
    var t = tiers[id];
    if (!t.presented) return;
    var tr = el('tr', '');
    tr.appendChild(el('td', '', t.name || id));
    tr.appendChild(el('td', '', t.class_old || ''));
    tr.appendChild(el('td', '', String(t.tier || '')));
    tr.appendChild(el('td', '', t.letter || ''));

    var pathStr = '';
    if (t.paths) {
      pathStr = Object.keys(t.paths).map(function (p) {
        return p + ' L' + t.paths[p];
      }).join(', ');
    }
    if (t.override) pathStr = t.override;
    tr.appendChild(el('td', '', pathStr));

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  frag.appendChild(table);
  frag.appendChild(el('p', 'fingerprint', 'Veil Protocol &mdash; System Reference'));
  setContent('tab-system', frag);
}

/* ── init ── */
async function init() {
  try {
    var base = '../content/registry/';
    var results = await Promise.all([
      fetch(base + 'artifacts.json').then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }),
      fetch(base + 'authored.json').then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }),
      fetch(base + 'bestiary.json').then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }),
      fetch(base + 'domains.json').then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }),
      fetch(base + 'places.json').then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }),
      fetch(base + 'tiers.json').then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }),
      fetch('../content/domains/xiii-duty.json').then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    ]);

    var artifacts = results[0];
    var authored  = results[1];
    var bestiary  = results[2];
    var domains   = results[3];
    var places    = results[4];
    var tiers     = results[5];
    var xiii      = results[6];

    renderArchive(artifacts);
    renderChapter1();
    renderCharacters(authored);
    renderThirteen(domains, xiii);
    renderBestiary(bestiary);
    renderCity(places);
    renderSystem(tiers);

  } catch (err) {
    console.error('VP init error', err);
    var panels = ['tab-archive','tab-chapter1','tab-characters','tab-thirteen','tab-bestiary','tab-city','tab-system'];
    panels.forEach(function (p) {
      var panel = document.getElementById(p);
      var wrap = panel && panel.querySelector('.content');
      if (wrap && wrap.querySelector('.loading-state')) {
        wrap.innerHTML = '<div class="error-state">Content unavailable. Serve this file over HTTP to load from the content registry.</div>';
      }
    });
    // Chapter one can still render from the already-loaded scripts
    renderChapter1();
  }
}

init();

})();
</script>
