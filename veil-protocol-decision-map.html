var g=document.getElementById('vp'),stage=document.getElementById('stage');
var sc=1,tx=0,ty=0,drag=false,px=0,py=0;
function apply(){g.setAttribute('transform','translate('+tx+','+ty+') scale('+sc+')');}
function zoom(f){sc=Math.max(.3,Math.min(3,sc*f));apply();}
function reset(){sc=1;tx=0;ty=0;apply();}
function show(v){g.innerHTML=VIEWS[v]||'';reset();}
document.querySelectorAll('#tabs button').forEach(function(b){b.onclick=function(){document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');show(b.getAttribute('data-v'));};});
stage.addEventListener('wheel',function(e){e.preventDefault();zoom(e.deltaY<0?1.1:0.9);},{passive:false});
stage.addEventListener('pointerdown',function(e){drag=true;px=e.clientX;py=e.clientY;stage.classList.add('drag');});
window.addEventListener('pointermove',function(e){if(!drag)return;tx+=e.clientX-px;ty+=e.clientY-py;px=e.clientX;py=e.clientY;apply();});
window.addEventListener('pointerup',function(){drag=false;stage.classList.remove('drag');});
show('overview');
