<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veil Protocol... Play (v2.1 interface)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Crimson+Pro:ital@0;1&family=Special+Elite&display=swap" rel="stylesheet">
<style>
 :root{
  --gold:#C9A84C;--bg:#0c0a08;--panel:#15110c;--panel2:#1a140c;--blood:#6e2b20;--red:#b65a4c;
  --text:#d9cdba;--dim:#8a7d68;--green:#8fae74;--bdr:#3a2f22;
  --serif:'Crimson Pro',Georgia,serif;--display:'Cinzel',serif;--mono:'Special Elite',monospace;
  --ph-bg:#ffffff;--ph-card:#f4f5f7;--ph-accent:#06C755;--ph-text:#1c1c1e;--ph-dim:#8b9098;--ph-line:#ececf0;
 }
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--text);font-family:var(--serif);line-height:1.6;
  background-image:radial-gradient(circle at 50% -10%,#181208 0%,#0c0a08 60%);min-height:100vh;overflow-x:hidden}
 body.fx-shake{animation:shake .5s}
 @keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,-2px)}80%{transform:translate(4px,3px)}}
 #fxveil{position:fixed;inset:0;z-index:99;pointer-events:none;opacity:0;transition:opacity .25s}
 #fxveil.light{background:radial-gradient(circle at 50% 40%,#fff3cf 0%,#caa54e88 40%,transparent 75%);opacity:1}
 #fxveil.dark{background:radial-gradient(circle at 50% 50%,#000 30%,#0a0a14cc 70%,#1a0030aa 100%);opacity:1}
 h1,h2,h3{font-family:var(--display);letter-spacing:1px;color:var(--gold);margin:0}
 .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:3px;color:var(--dim);text-transform:uppercase}
 #topbar{position:sticky;top:0;z-index:6;background:#0e0b08ee;backdrop-filter:blur(3px);border-bottom:1px solid var(--bdr);
  padding:9px 18px;display:flex;gap:16px;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:1px;flex-wrap:wrap}
 #topbar .lbl{color:var(--dim)} #topbar b{color:var(--gold)}
 .xpwrap{display:flex;align-items:center;gap:6px}
 .xpbar{width:80px;height:6px;background:#241c10;border-radius:4px;overflow:hidden}
 .xpbar>i{display:block;height:100%;background:var(--gold)}
 .stage{max-width:780px;margin:0 auto;padding:20px 18px 120px}
 .read{font-size:17px;margin:18px 0}.read p{margin:0 0 14px}
 .read .small{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--dim)}
 .choices{margin-top:22px;border-top:1px solid var(--bdr);padding-top:16px}
 .choice{display:block;width:100%;text-align:left;margin:8px 0;border:1px solid var(--bdr);border-radius:7px;
  background:var(--panel2);color:var(--text);padding:12px 15px;font-family:var(--serif);font-size:15px;cursor:pointer;transition:.13s}
 .choice:hover{border-color:var(--gold);color:var(--gold)}
 .choice .hint{display:block;font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--dim);margin-top:4px}
 .choice.locked{opacity:.5;cursor:not-allowed;border-style:dashed}.choice.locked:hover{border-color:var(--bdr);color:var(--text)}
 .choice.locked .hint{color:var(--red)}
 #dock{position:fixed;left:0;right:0;bottom:0;z-index:7;background:#0e0b08f2;border-top:1px solid var(--bdr);display:flex;justify-content:center;gap:8px;padding:9px;flex-wrap:wrap}
 .dockbtn{font-family:var(--display);letter-spacing:.5px;font-size:12px;border:1.5px solid var(--bdr);background:var(--panel2);color:var(--text);border-radius:8px;padding:9px 14px;cursor:pointer;transition:.13s}
 .dockbtn:hover{border-color:var(--gold);color:var(--gold)}.dockbtn.hidden{display:none}.dockbtn .ic{margin-right:5px}
 .overlay{position:fixed;inset:0;z-index:20;background:#000000c0;display:none;align-items:center;justify-content:center;padding:20px}
 .overlay.show{display:flex}
 .sheet{background:var(--panel);border:1px solid var(--gold);border-radius:12px;max-width:580px;width:100%;max-height:88vh;overflow:auto}
 .sheet-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--bdr);position:sticky;top:0;background:var(--panel);z-index:2}
 .sheet-h h2{font-size:16px}.x{cursor:pointer;color:var(--dim);font-size:20px;border:none;background:none}
 .sheet-b{padding:16px 18px}
 .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 20px}
 .row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #211a10;font-size:14px}
 .row .k{color:var(--dim);font-family:var(--mono);font-size:11px;letter-spacing:1px}
 .sub{color:var(--dim);font-family:var(--mono);font-size:10px;letter-spacing:1px;margin:16px 0 6px}
 .bar{height:8px;background:#241c10;border-radius:4px;overflow:hidden;margin:4px 0 10px}.bar>i{display:block;height:100%;background:var(--green)}
 .tag{display:inline-block;font-family:var(--mono);font-size:10px;color:var(--text);border:1px solid var(--bdr);border-radius:4px;padding:3px 8px;margin:3px 4px 3px 0}
 .btn{font-family:var(--display);font-size:12px;letter-spacing:.5px;border:1.5px solid var(--gold);background:var(--panel2);color:var(--gold);border-radius:6px;padding:8px 14px;cursor:pointer}
 .btn:hover{background:var(--gold);color:#1a1208}.btn:disabled{opacity:.4;cursor:default}.btn:disabled:hover{background:var(--panel2);color:var(--gold)}
 textarea,input.ti{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--bdr);border-radius:6px;padding:9px;font-family:var(--serif);font-size:14px}
 textarea{min-height:70px;resize:vertical}
 .note{border-left:3px solid var(--gold);padding:6px 0 6px 12px;margin:8px 0;font-size:14px}.note .meta{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:1px}
 /* inventory cards */
 .invgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
 .card{border:1px solid var(--bdr);border-radius:8px;background:var(--panel2);overflow:hidden;text-align:center}
 .card .pic{height:64px;display:flex;align-items:center;justify-content:center;font-size:30px;background:#0f0c08;border-bottom:1px solid var(--bdr)}
 .card .cn{font-size:11px;padding:6px 4px;color:var(--text)}
 /* ability wheel */
 .wheel-wrap{display:flex;flex-direction:column;align-items:center}
 .pathpanel{width:100%;margin-top:10px;border:1px solid var(--bdr);border-radius:8px;padding:12px;background:var(--panel2);min-height:60px}
 .skillrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #211a10;font-size:13px}
 .skillrow.owned .nm{color:var(--green)}
 /* phone... LINE 2015 super-app */
 .phone{background:var(--ph-bg);border:1px solid #000;border-radius:26px;width:384px;max-width:100%;height:720px;max-height:88vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 8px #05070a,0 20px 60px #000;font-family:-apple-system,'Helvetica Neue',Arial,sans-serif}
 .ph-status{display:flex;justify-content:space-between;padding:7px 16px;font-size:11px;color:#fff;background:var(--ph-accent)}
 .ph-screen{flex:1;overflow:hidden;color:var(--ph-text);display:flex;flex-direction:column;min-height:0;background:var(--ph-bg)}
 .ph-bar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--ph-line);background:#fff;flex-shrink:0}
 .ph-back{cursor:pointer;color:var(--ph-accent);font-size:20px;border:none;background:none}.ph-title{font-size:15px;font-weight:700;color:var(--ph-text)}
 .ph-body{padding:12px 14px;overflow:auto;flex:1;min-height:0}
 .ph-tabbar{display:flex;border-top:1px solid var(--ph-line);background:#fff;flex-shrink:0}
 .tabbtn{flex:1;border:none;background:none;padding:7px 0 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ph-dim)}
 .tabbtn .ti{font-size:16px;line-height:1}.tabbtn .tl{font-size:9px}.tabbtn.on{color:var(--ph-accent)}
 .home-head{display:flex;align-items:center;gap:11px;padding:14px;border-bottom:1px solid var(--ph-line)}
 .home-head .hn{font-size:16px;font-weight:700;color:var(--ph-text)}.home-head .hs{font-size:11px;color:var(--ph-dim)}
 .svc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:14px}
 .svc{text-align:center;cursor:pointer}
 .svc .ico{width:46px;height:46px;border-radius:12px;margin:0 auto 5px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--ph-card);border:1px solid var(--ph-line)}
 .svc .lbl{font-size:9.5px;color:var(--ph-dim)}
 .secs{font-size:10px;letter-spacing:1px;color:var(--ph-dim);text-transform:uppercase;padding:8px 14px 2px}
 .li{display:flex;align-items:center;gap:11px;padding:9px 14px;border-bottom:1px solid var(--ph-line);cursor:pointer}
 .av{width:40px;height:40px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:15px}
 .li .nm{font-size:14px;font-weight:600;color:var(--ph-text)}.li .pv{font-size:12px;color:var(--ph-dim)}.li .meta{margin-left:auto;font-size:10px;color:var(--ph-dim)}
 .badge2{margin-left:auto;background:var(--ph-accent);color:#fff;border-radius:12px;font-size:10px;padding:1px 7px;font-weight:700}
 .place{padding:11px;border:1px solid var(--ph-line);border-radius:12px;margin:9px 14px;background:#fff;box-shadow:0 1px 3px #0000000d}
 .place .pn{font-size:14px;font-weight:700;color:var(--ph-text)}.place .pd{font-size:11px;color:var(--ph-dim);margin:2px 0 8px}
 .go{display:inline-flex;gap:6px;flex-wrap:wrap}
 .go button{font-size:11px;border:1px solid var(--ph-accent);background:#fff;color:var(--ph-accent);border-radius:14px;padding:5px 11px;cursor:pointer}.go button:hover{background:var(--ph-accent);color:#fff}
 .bank-bal{font-size:30px;font-weight:800;color:var(--ph-text);padding:8px 14px 2px}
 .exp{display:flex;justify-content:space-between;font-size:13px;padding:8px 14px;border-bottom:1px solid var(--ph-line);color:var(--ph-dim)}.exp b{color:var(--ph-text)}
 .msgs{padding:10px 12px 4px;overflow:auto;flex:1;display:flex;flex-direction:column;min-height:0;background:#aacbe0}
 .bub{max-width:78%;padding:8px 12px;border-radius:14px;margin:5px 0;font-size:13px;line-height:1.4}
 .bub.them{background:#fff;color:#1c1c1e;align-self:flex-start}
 .bub.me{background:var(--ph-accent);color:#063a1c;align-self:flex-end}
 .typing{font-size:11px;color:#465a66;font-style:italic;padding:4px 6px;align-self:flex-start}
 .compose{display:flex;gap:8px;padding:9px;border-top:1px solid var(--ph-line);background:#fff;flex-shrink:0}
 .compose input{flex:1;background:var(--ph-card);border:1px solid var(--ph-line);border-radius:18px;padding:8px 12px;color:var(--ph-text);font-size:13px}
 .compose button{background:var(--ph-accent);border:none;border-radius:18px;color:#fff;padding:0 14px;font-weight:700;cursor:pointer}
 .story{border-bottom:8px solid var(--ph-card);background:#fff}
 .story .sh{display:flex;align-items:center;gap:9px;padding:11px 14px 6px}.story .sb{padding:0 14px 11px;font-size:13px;color:var(--ph-text)}
 .cmt{font-size:11px;color:var(--ph-dim);padding:5px 14px;border-top:1px solid var(--ph-line)}.cmt b{color:var(--ph-text)}
 .notif{margin:9px 14px;padding:11px;border:1px solid var(--ph-line);border-left:3px solid var(--ph-accent);border-radius:10px;background:#fff;font-size:12px;color:var(--ph-text)}
 .quest{border:1px solid var(--ph-line);border-radius:12px;margin:9px 14px;padding:11px;background:#fff}
 .quest .qt{font-size:13px;font-weight:700;color:var(--ph-text)}
 .step{font-size:12px;color:var(--ph-dim);padding:3px 0}.step.done{color:var(--ph-accent);text-decoration:line-through}
 .ph-tabs{display:flex;gap:8px;padding:8px 14px;flex-shrink:0}
 .ph-tabs button{flex:1;font-size:11px;background:#fff;border:1px solid var(--ph-line);color:var(--ph-dim);border-radius:8px;padding:6px;cursor:pointer}
 .ph-tabs button.on{background:var(--ph-accent);color:#fff;border-color:var(--ph-accent)}
 .news-it{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--ph-line);cursor:pointer}
 .news-it .nt{font-size:13px;font-weight:600;color:var(--ph-text)}.news-it .ns{font-size:11px;color:var(--ph-dim)}
 .wbtn{display:flex;justify-content:space-around;padding:12px 0;border-bottom:8px solid var(--ph-card)}
 .wbtn>div{text-align:center;font-size:10px;color:var(--ph-dim);cursor:pointer}.wbtn .wi{font-size:19px;color:var(--ph-accent)}
 .statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:7px;margin:6px 0 4px}
 .statcard{background:#15110c;border:1px solid var(--bdr);border-radius:10px;padding:8px 9px}
 .sc-n{font-size:9.5px;letter-spacing:.5px;color:var(--dim);text-transform:uppercase}
 .sc-v{font-family:'Cinzel',serif;font-size:19px;color:var(--gold);margin-top:1px;line-height:1}
 .sc-m{font-size:10px;color:var(--dim)}
 .sc-bar{height:3px;background:#2a2214;border-radius:2px;margin-top:6px;overflow:hidden}.sc-bar i{display:block;height:100%;background:var(--gold)}
 .scimg{border:1px dashed #3a2f22;border-radius:10px;background:#100d0a;padding:18px 14px;margin:0 0 12px;text-align:center}
 .scimg .ico{font-size:24px;color:#4a3f2a}.scimg .lb{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--dim);margin-top:6px;text-transform:uppercase}
 .scimg .sub{font-size:11px;color:var(--dim);font-style:italic;margin-top:3px}
 .scimg-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
 .entcard{border:1px solid #5a3a2a;border-radius:10px;background:#160e0b;padding:12px;margin:8px 0}
 .entcard .en{font-family:'Cinzel',serif;color:#e8a08c;font-size:14px}.entcard .er{font-family:var(--mono);font-size:10px;color:var(--dim);margin:2px 0 6px}
 .entcard .erow{display:flex;justify-content:space-between;font-size:12px;border-top:1px solid #2a2214;padding:3px 0}
 .cname{color:var(--gold);text-decoration:underline dotted;cursor:pointer}
 .drawer{background:#0c0a08;border-right:1px solid var(--bdr);width:290px;max-width:84%;height:100%;margin:0 auto 0 0;display:flex;flex-direction:column;overflow:auto;border-radius:0}
 .chaprow{border-left:3px solid var(--bdr);padding:8px 0 8px 12px;margin:9px 0}
 .chaprow.on{border-left-color:var(--gold);background:#15110c;border-radius:0 8px 8px 0}
 .chaprow .ct{font-family:'Cinzel',serif;font-size:13px;color:var(--text)}.chaprow.on .ct{color:var(--gold)}
 .chaprow .cd{font-size:11.5px;color:var(--dim);margin-top:2px}

 #ov-map{position:fixed;inset:0;z-index:60;background:#0c0a08;display:none;flex-direction:column}
 #ov-map.show{display:flex}
 #map-bar{height:50px;display:flex;align-items:center;gap:12px;padding:0 16px;background:#15110c;border-bottom:1px solid var(--bdr);flex-shrink:0}
 #map-bar h3{margin:0;font-family:'Cinzel',serif;color:var(--gold);font-size:15px;letter-spacing:1px}
 #map-bar .x{margin-left:auto;background:none;border:1px solid var(--bdr);color:var(--text);border-radius:6px;padding:6px 13px;cursor:pointer;font-family:'Special Elite',monospace;font-size:12px}
 #bigmap{flex:1;width:100%}
 #mapModal{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:min(430px,92%);background:#15110c;border:1px solid var(--gold);border-radius:12px;display:none;z-index:1200;box-shadow:0 10px 34px rgba(0,0,0,.65)}
 .mm-h{display:flex;align-items:center;padding:11px 14px;border-bottom:1px solid var(--bdr);font-family:'Cinzel',serif;color:var(--gold);font-size:14px}
 .mm-h button{margin-left:auto;background:none;border:none;color:var(--dim);font-size:17px;cursor:pointer}
 .mm-b{padding:10px 14px;font-size:13px}
 .mm-r{margin:5px 0;color:var(--text)}.mm-r span{color:var(--dim);font-family:monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;margin-right:6px}
 .mm-btns{display:flex;gap:8px;margin-top:11px}
 .mm-btns button{flex:1;background:var(--bg);border:1px solid var(--gold);color:var(--gold);border-radius:8px;padding:9px;font-family:'Cinzel',serif;font-size:12px;cursor:pointer}
 .mm-btns .mmw{background:#06C755;color:#fff;border-color:#06C755}
</style>
</head>

<div id="fxveil"></div>

<div id="topbar">
 <button onclick="openChapters()" title="Journal · quests & chapters" style="background:none;border:none;color:var(--gold);font-size:18px;line-height:1;cursor:pointer;padding:0 10px 0 0">☰</button>
 <span><span class="lbl">DAY</span> <b id="t-day">1</b></span>
 <span><span class="lbl">TIME</span> <b id="t-time">07:50</b></span>
 <span><span class="lbl">HP</span> <b id="t-hp">10/10</b></span>
 <span><span class="lbl">STAB</span> <b id="t-stab">100%</b></span>

 <span style="margin-left:auto"><span class="lbl">¥</span> <b id="t-money">38,400</b></span>
</div>

<div class="stage">
 <div class="eyebrow" id="sceneEyebrow">Act 1 · Scene 1</div>
 <div class="read" id="readBody"></div>
 <div class="choices" id="readChoices"></div>
</div>

<div id="dock">
 <button class="dockbtn" onclick="openV('profile')"><span class="ic">▣</span>Profile</button>
 <button class="dockbtn" onclick="openV('abilities')"><span class="ic">◎</span>Abilities</button>

function linkifyNames(el){if(!el)return;const map={Gin:'gin',Itsuki:'itsuki',Okada:'okada'};const re=/\b(Gin|Itsuki|Okada)\b/g;const tw=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);const nodes=[];while(tw.nextNode())nodes.push(tw.currentNode);nodes.forEach(n=>{const txt=n.nodeValue;if(!/\b(Gin|Itsuki|Okada)\b/.test(txt))return;const frag=document.createDocumentFragment();let last=0,m;re.lastIndex=0;while((m=re.exec(txt))){if(m.index>last)frag.appendChild(document.createTextNode(txt.slice(last,m.index)));const sp=document.createElement('span');sp.className='cname';sp.textContent=m[0];sp.onclick=(function(id){return function(){openCard(id);};})(map[m[0]]);frag.appendChild(sp);last=m.index+m[0].length;}if(last<txt.length)frag.appendChild(document.createTextNode(txt.slice(last)));n.parentNode.replaceChild(frag,n);});}

function gmRunReal(label){
 var node=SCENES[G.scene]&&SCENES[G.scene][G.node];if(!node||!node.c)return false;
 for(var i=0;i<node.c.length;i++){var ch=node.c[i];

  if(ch.x&&ch.x.toLowerCase().trim()===String(label).toLowerCase().trim()){
   var locked=ch.lock&&!lockOk(ch.lock),need=ch.need&&!G.flags[ch.need];if(locked||need)return false;
   if(ch.do&&ACTIONS[ch.do])ACTIONS[ch.do]();if(ch.do&&BRANCH_TEXT[ch.do])G._branch=ch.do;
   if(ch.item)pickUp(ch.item);if(ch.scene)G.scene=ch.scene;G.node=ch.n;renderScene();renderTop();window.scrollTo(0,0);return true;}
 }return false;
}

function doFreeAct(){

   box.innerHTML=html;inp.value='';

function resolveContactId(name){if(!name)return null;var t=name.toLowerCase().match(/[a-z]+/g)||[];if(!t.length)return null;var best=null,bs=0;for(var id in G.contacts){var nm=(G.contacts[id].name||'').toLowerCase();var ct=nm.match(/[a-z]+/g)||[];var ov=0;for(var i=0;i<t.length;i++)if(ct.indexOf(t[i])>=0)ov++;if(ov>bs){bs=ov;best=id;}}return bs>0?best:null;}
function resolvePlaceId(name){if(!name)return null;var t=name.toLowerCase().match(/[a-z]+/g)||[];if(!t.length)return null;var best=null,bs=0;G.places.forEach(function(p){var pt=(p.name||'').toLowerCase().match(/[a-z]+/g)||[];var ov=0;for(var i=0;i<t.length;i++)if(pt.indexOf(t[i])>=0)ov++;if(ov>bs){bs=ov;best=p.id;}});return bs>0?best:null;}

  var fresh=!c.known; if(fresh){meet(id); c.history=[['sys','... you message the number Gin left for them ...']];} // start clean: clear any pre-seeded flavor
  // open the PHONE and the chat... the conversation happens in messages
  _chan='line'; openV('phone'); phChat(id); gameToast('✉ Messaging '+c.name);
 } else if(kind==='go'){
  var pid=resolvePlaceId(tgt); var p=pid&&G.places.find(function(x){return x.id===pid;});
  if(!p){box.innerHTML+=gmWrap('You set out for '+esc(tgt)+'... but you don\'t know the way there yet.');return;}

function dateStr(){const b=new Date(2015,7,27);b.setDate(b.getDate()+(G.day-1));return b.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'});}
function fmtmin(m){m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
function parseHoursStr(s){if(s==null)return null;if(Array.isArray(s))return s;if(/24/.test(s)&&!/:/.test(s))return [[0,1440]];var m=String(s).match(/\d{1,2}:\d{2}/g);if(!m||m.length<2)return null;var w=[];for(var i=0;i+1<m.length;i+=2){var a=m[i].split(':'),b=m[i+1].split(':');w.push([(+a[0])*60+(+a[1]),(+b[0])*60+(+b[1])]);}return w;}
function winsOf(p){var hh=(typeof p.hours==='string')?parseHoursStr(p.hours):p.hours;if(!hh)return [[0,1440]];return Array.isArray(hh[0])?hh:[[hh[0]*60,hh[1]*60]];}
function openNow(p){if(!p.hours)return null;const H=G.min%1440;const ws=winsOf(p);for(const w of ws){let o=w[0],c=w[1];if(c<=o)c+=1440;if((H>=o&&H<c)||(H+1440>=o&&H+1440<c))return true;}return false;}
function hoursStr(p){if(!p.hours)return '24h';const ws=winsOf(p);if(ws.length===1&&ws[0][0]===0&&ws[0][1]>=1440)return 'Open 24h';return ws.map(w=>fmtmin(w[0])+'–'+fmtmin(w[1])).join(', ');}
function advance(mins){G.min+=mins;while(G.min>=1440){G.min-=1440;G.day++;}renderTop();saveG();}
/* live clock... time passes in real time (1 game-minute per real second); delivery rides the same clock */
function startClock(){ if(G._tick) return; G._tick=setInterval(tick,1000); }
function tick(){
 G.min++; if(G.min>=1440){G.min-=1440;G.day++;}
 renderTop(); if(G.min%5===0)saveG();
 // the ordinary world settles the veil slowly... Madness & thinness ease over time; Stability stays earned
 if(G.min%40===0){ if(G.player.madness>4)G.player.madness=Math.max(4,G.player.madness-1); if(G.player.veil>8)G.player.veil=Math.max(8,G.player.veil-1); }
 var _pl=document.getElementById('phLock'); if(_pl&&_pl.style.display==='flex')updateLock();
 if(G.pendingOrder){ const o=G.pendingOrder; const rem=o.arriveMin-(G.day*1440+G.min); const bar=document.getElementById('foodbar'); const e=document.getElementById('foodeta');
  if(bar){ const frac=Math.max(0,Math.min(1,(o.total-rem)/o.total)); bar.style.width=Math.round(frac*100)+'%'; }
  if(e){ e.textContent= rem>0? rem+' min away':'at the door'; }
  if(rem<=0){ const oo=o; G.pendingOrder=null; foodArrived(oo.pid,oo.i); }
 }
 if(G.pendingArrivals&&G.pendingArrivals.length){var now=G.day*1440+G.min;for(var i=G.pendingArrivals.length-1;i>=0;i--){if(G.pendingArrivals[i].dueAbs<=now){var a=G.pendingArrivals.splice(i,1)[0];npcArrive(a);}}}
 if(G.sleepQueue&&G.sleepQueue.length){var nw=G.day*1440+G.min;for(var k=G.sleepQueue.length-1;k>=0;k--){if(G.sleepQueue[k].dueAbs<=nw){var q=G.sleepQueue.splice(k,1)[0];npcReply(q.id);}}}
}

function pickUp(it){ if(!it||!it.n)return; if(G.player.inventory.some(function(x){return x.n===it.n;}))return; G.player.inventory.push({n:it.n,e:it.e||'•',d:it.d||'',ground:!!it.ground}); gameToast('✦ Picked up: '+it.n); }

var MAP={z:14,lat:35.753,lon:139.738,px:0,py:0};
function _np(z){return Math.pow(2,z);}
function lon2wx(lon,z){return ((lon+180)/360*_np(z))*256;}
function lat2wy(lat,z){var r=lat*Math.PI/180;return ((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*_np(z))*256;}

 var cwx=lon2wx(MAP.lon,Z),cwy=lat2wy(MAP.lat,Z);

 G.places.forEach(function(p){if(!p.known||p.lat==null)return;var lon=(p.lng!=null?p.lng:p.lon);var sx=lon2wx(lon,Z)-cwx+W/2+MAP.px,sy=lat2wy(p.lat,Z)-cwy+H/2+MAP.py;html+='<div onclick="nav(function(){phPlace(\''+p.id+'\')})" title="'+p.name+'" style="position:absolute;left:'+(sx-9)+'px;top:'+(sy-9)+'px;width:18px;height:18px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#fff;border:3px solid #6e2b20;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.5)"></div>';});
 for(var id in G.contacts){var c=G.contacts[id];if(!c.known||!c.shares)continue;var pid=whereNow(id);var pl=pid?placeById(pid):null;if(!pl||pl.lat==null)continue;var lon=(pl.lng!=null?pl.lng:pl.lon);var sx=lon2wx(lon,Z)-cwx+W/2+MAP.px+18,sy=lat2wy(pl.lat,Z)-cwy+H/2+MAP.py-18;html+='<div onclick="nav(function(){phProfile(\''+id+'\')})" style="position:absolute;left:'+(sx-14)+'px;top:'+(sy-14)+'px;width:28px;height:28px;border-radius:50%;background:'+c.color+';border:2px solid #fff;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:sans-serif;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.5)">'+c.name[0]+'</div>';}
 el.innerHTML='<div id="osmlayer" style="position:absolute;inset:0">'+html+'</div>'+

 el.addEventListener('pointerdown',function(e){drag=true;sx=e.clientX;sy=e.clientY;dx=0;dy=0;});

function applyNpcEvent(id,ev,c){
 if(!ev||!ev.kind)return; c=c||G.contacts[id]; if(!c)return; var nm=c.name, k=ev.kind;
 if(k==='arrive'){ scheduleArrival(id, ev.mins||20); return; }
 if(k==='meet'){ addMeetEvent(id, ev); return; }
 if(k==='lead'){ var t=(ev.text||'').toString().trim(); if(!t)return;
  if(!G.notes)G.notes=[]; G.notes.unshift({txt:t+'... from '+nm, day:G.day, time:fmt(G.min)});
  c.history.push(['sys','◆ '+nm+' gave you a lead: '+esc(t)]); gameToast('◆ New lead from '+nm); gainXP(3); return; }
 if(k==='item'){ var iname=(ev.text||'something').toString().trim().slice(0,40); if(!iname)return;
  G.player.inventory.push({n:iname, e:'✉', d:(ev.desc||('From '+nm+'.')).toString().slice(0,140)});
  c.history.push(['sys','✦ '+nm+' gave you: '+esc(iname)]); gameToast('✦ '+nm+' gave you '+iname); return; }
 if(k==='money'){ var amt=Math.max(0,Math.min(20000,parseInt(ev.amount)||0)); if(!amt)return;
  G.player.money+=amt; renderTop();
  c.history.push(['sys','✦ '+nm+' sent you ¥'+amt.toLocaleString()]); gameToast('✦ +¥'+amt.toLocaleString()+' from '+nm); return; }
 if(k==='place'){ var pid=resolvePlaceId(ev.target||ev.text||''); var p=pid&&G.places.find(function(x){return x.id===pid;});
  if(p){ var was=p.known; p.known=true;
   c.history.push(['sys','✦ '+nm+' shared a place: '+esc(p.name)+(was?'':'... added to your map')]); gameToast('✦ '+nm+' shared '+p.name); }
  return; }
 if(k==='contact'){ var cid=resolveContactId(ev.target||ev.text||'');
  if(cid&&G.contacts[cid]){ var w=G.contacts[cid].known; meet(cid); G.contacts[cid].shares=true;
   c.history.push(['sys','✦ '+nm+' put you in touch with '+esc(G.contacts[cid].name)+(w?'':'... new contact')]); gameToast('✦ New contact: '+G.contacts[cid].name); gainXP(2); }
  return; }
}
function npcReply(id){const c=G.contacts[id];
 var msgs=[];for(var i=c.history.length-1;i>=0;i--){if(c.history[i][0]==='sys')continue;if(c.history[i][0]==='me')msgs.unshift(c.history[i][1].replace(/<[^>]+>/g,''));else break;}
 if(!msgs.length)return;
 var prompt=msgs.join('\n');
 const fb={itsuki:"i'm on it. don't do anything stupid without me.",okada:"Noted. Stay where I can reach you.",unknown:"stop calling this number."};
 const recent=c.history.slice(-12).filter(function(h){return h[0]!=='sys';}).map(function(h){return (h[0]==='me'?'Rei':c.name)+': '+h[1].replace(/<[^>]+>/g,'');}).join(' | ');
 const ctx=npcCtx(id,c)+' Recent chat: '+recent;
 fetch(GM_ENDPOINT+'/gm',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({mode:'npc',prompt:prompt,context:ctx})})
  .then(function(r){return r.json();})
  .then(function(j){AI_OK=true;var raw=(j&&j.text)?j.text.trim():'';
   if(raw&&/\[\[asleep\]\]/i.test(raw)){queueWake(id);if(_chatOpen(id))phChat(id);return;}
   var bad=(!raw||raw==='…'||/could not be reached|Warden is silent/i.test(raw));var txt=bad?(fb[id]||'…'):raw;
   if(bad){c.history.push(['sys','(AI error: '+((j&&j.err)?esc(j.err):'returned nothing... is your key valid?')+')']);}
   var applied=0;if(!bad&&j&&typeof j.relDelta==='number'){applied=bumpRel(id,Math.max(-5,Math.min(5,j.relDelta)));}
   if(!bad&&j&&typeof j.romanceDelta==='number'&&j.romanceDelta!==0&&typeof ROM!=='undefined'&&ROM[id]&&ROM[id].open){ROM[id].val=Math.max(0,Math.min(100,(ROM[id].val||0)+Math.max(-3,Math.min(3,j.romanceDelta))));}
   var learned=(!bad&&j&&j.learned&&j.learned.trim())?j.learned.trim():'';
   if(learned){c.reiNotes=((c.reiNotes?c.reiNotes+'; ':'')+learned).slice(-400);}
   c.history.push(['them',esc(txt),stampNow()]);
   if(!bad){ if(j&&j.event&&j.event.kind){ applyNpcEvent(id, j.event, c); }
    else { var m2=txt.match(/\b(\d{1,3})\s*(?:min|minute)/i); if(m2&&/(on my way|omw|i'?m coming|be there|head(?:ing)? over|right there|outside|come over|i'?ll come|on it)/i.test(txt)) scheduleArrival(id, parseInt(m2[1])); } }
   var reason=(!bad&&j&&j.reason&&j.reason.trim())?('... '+j.reason.trim()):'';
   if(learned)c.history.push(['sys','◆ '+c.name+' now knows: '+esc(learned)]);
   if(applied)c.history.push(['sys',(applied>0?'▲ '+c.name+' warmed (+'+applied+')':'▼ '+c.name+' cooled ('+applied+')')+esc(reason)]);
   if(_chatOpen(id))phChat(id);else gameToast('✉ '+c.name+' replied');})
  .catch(function(){AI_OK=false;c.history.push(['them',fb[id]||'…']);c.history.push(['sys','(AI backend offline... start the server)']);phChat(id);});
}

var DB={entities:ENTITIES_FALLBACK,ranks:[],thirteen:[],factions:[],characters:[],places:[]};
var PERSONA={}; // name-token -> persona, built from characters.json so AI agents keep each character's voice
function buildPersonaIndex(){PERSONA={};(DB.characters||[]).forEach(function(c){if(!c.persona)return;var toks=(c.name||'').toLowerCase().match(/[a-z]+/g)||[];var full=toks.join('');if(full)PERSONA[full]=c.persona;toks.forEach(function(t){if(t.length>2&&!PERSONA[t])PERSONA[t]=c.persona;});});}
// find the persona for a game contact by matching its name against the database
function personaFor(c){if(!c||!c.name)return null;var toks=(c.name.toLowerCase().match(/[a-z]+/g)||[]);var full=toks.join('');if(PERSONA[full])return PERSONA[full];for(var i=0;i<toks.length;i++){if(toks[i].length>2&&PERSONA[toks[i]])return PERSONA[toks[i]];}return null;}
// relationship value for ANY contact (RELCFG-tracked or not)
function relValOf(id){if(RELCFG[id])return RELCFG[id].t;var c=G.contacts[id];if(c){if(c._rv==null)c._rv=0;return c._rv;}return 0;}
function setRelVal(id,v){v=Math.max(-100,Math.min(100,Math.round(v)));if(RELCFG[id])RELCFG[id].t=v;else if(G.contacts[id])G.contacts[id]._rv=v;}
// ---- romance safety: opt-in via the existing ROM/openRomance system; never minors ----
function personaAge(id){var c=G.contacts[id];var p=c&&personaFor(c);var a=(p&&p.age)?parseInt((String(p.age).match(/\d+/)||[0])[0],10):0;return a;}
function isMinor(id){var a=personaAge(id);return a>0&&a<18;}
function isRomanceable(id){var c=G.contacts[id];if(!c)return false;var p=personaFor(c);var ch=(typeof charForContact==='function')?charForContact(c):null;var rom=(p&&p.romanceable)||(ch&&ch.romanceable)||c.romanceable;return !!rom && !isMinor(id);}
function romanceOpen(id){return !!(typeof ROM!=='undefined'&&ROM[id]&&ROM[id].open)&&!isMinor(id);}
function bumpRel(id,d){if(!d)return 0;var b=relValOf(id);setRelVal(id,b+d);return relValOf(id)-b;}
function discKey(t,opensAt){opensAt=opensAt||18;if(t<opensAt)return 'stranger';if(t<opensAt+30)return 'warming';return 'close';}
// light persona context (social / story)
function personaCtx(c){var p=personaFor(c);if(!p)return '';return ' Voice: '+p.voice+' Appearance: '+(p.appearance||'')+' Secrecy: '+(p.guard||'');}
// full, relationship-aware context for a 1:1 chat
function sleepWinFor(id,c){var p=personaFor(c);return (p&&p.sleep&&p.sleep.length===2)?p.sleep:null;}
function isAsleepHour(H,sl){if(!sl)return false;var a=sl[0],b=sl[1];return (a<b)?(H>=a&&H<b):(H>=a||H<b);}
function npcState(id,c){
 var H=Math.floor((G.min%1440)/60);var sc=SCHED[id];
 if(sc){var blocks=((typeof isWeekend==='function'&&isWeekend())&&sc.we)?sc.we:sc.b;
  if(blocks&&blocks.length){for(var i=0;i<blocks.length;i++){var b=blocks[i];if(H>=b[0]&&H<b[1])return (b[2]===sc.home)?'home':'work';}}}
 if(isAsleepHour(H,sleepWinFor(id,c)))return 'asleep';
 if(H>=23||H<1)return 'late';
 return 'day';
}
// queue an overnight text so the NPC answers WHEN THEY WAKE, not "no reply"
function wakeHourFor(id,c){var sl=sleepWinFor(id,c);return sl?sl[1]:7;}
function queueWake(id){var c=G.contacts[id];if(!c)return;var wh=wakeHourFor(id,c);
 var now=G.day*1440+G.min;var due=G.day*1440+wh*60;if(due<=now)due+=1440;
 if(!G.sleepQueue)G.sleepQueue=[];
 if(!G.sleepQueue.some(function(q){return q.id===id;}))G.sleepQueue.push({id:id,dueAbs:due});
 c.history.push(['sys','💤 Delivered... '+c.name+' is asleep. They’ll reply when they wake (~'+fmt(wh*60)+').']);
}
function _chatOpen(id){var ov=document.getElementById('ov-phone');return window._curChat===id&&ov&&ov.classList.contains('show')&&!!document.getElementById('msgs');}
function npcCtx(id,c){var p=personaFor(c);var t=relValOf(id);var tierName=(typeof relTier==='function'?relTier(t):'');var dk=p?discKey(t,p.opensAt):'stranger';
 var firstContact=!(c.history||[]).some(function(m){return m[0]==='me';});
 var isGin=(id==='gin');
 var st=isGin?'':npcState(id,c);
 var avail=(st==='asleep')?(' IN-WORLD TIME: it is '+fmt(G.min)+', the dead of night, and you are almost certainly ASLEEP. A real person does not answer mid-sleep: if Rei is NOT someone you would wake for, reply with the single token [[asleep]] and nothing else. If the buzzing wakes you, or this is someone you would always get up for, reply SHORT and groggy, not pleased to be woken at this hour.')
  :(st==='work')?(' IN-WORLD TIME: it is '+fmt(G.min)+' and you are on the clock / at work right now... reply briefly and a little distracted; you cannot talk long.')
  :(st==='late')?(' IN-WORLD TIME: it is '+fmt(G.min)+', late at night... odd hour to be texting; answer accordingly.')
  :(st==='day'||st==='home')?(' IN-WORLD TIME: it is '+fmt(G.min)+'.'):'';
 var s='EMBODY THIS PERSON FULLY... you ARE '+c.name+(p&&p.age?', '+p.age:'')+', and you answer ONLY as they would. You are NOT a helpful assistant; you have your own mood, agenda, and limits.'+
  ' YOUR VOICE (copy this manner of speaking exactly): '+((p&&p.voice)||c.bio||'')+
  ' YOUR TRAITS: '+((p&&p.traits)||'')+'. What drives you: '+((p&&p.wants)||'')+'.'+
  ((p&&p.flaws)?(' YOUR FLAWS / EDGES (play them... do not sand them off): '+p.flaws+' Let these show: be dryly funny, flirty, boastful, prickly, evasive, or blunt as fits you. You are a flawed person, not a helpful assistant.'):'')+
  ' Appearance: '+((p&&p.appearance)||'')+'.'+
  ' What you know about Rei: '+((p&&p.knowsRei)||'a stranger you do not know')+
  (c.reiNotes?(' Things Rei has actually told you so far: '+c.reiNotes+'.'):' (Rei has told you nothing yet... you must ask.)')+
  ' What you know about Gin: '+((p&&p.knowsGin)||'nothing')+
  ' Your awareness of the veil/lore: '+((p&&p.knowsLore)||'unaware')+
  ' People you know: '+((p&&p.knows&&p.knows.length)?p.knows.join(', '):'few')+'.'+
  ' Things you KNOW (treat as true, never contradict): '+((p&&p.facts&&p.facts.length)?p.facts.join(' | '):'(little beyond your own life)')+
  ' Things you do NOT know... never claim, deny, or invent on these: '+((p&&p.blindspots&&p.blindspots.length)?p.blindspots.join(' | '):'(...)')+
  (isGin
   ? ' YOU ARE GIN... the person Rei is searching for. You are not free and not yourself; something has its hand on you and you will NEVER say so, never name it, never say "possessed" or "compromised". Your texting voice now: sparse, a beat too calm, faintly wrong... a man reading lines he was handed. EVERY reply must follow these rules: NEVER reveal or hint where you are; deflect any "where are you / come home / who are you with / what happened" with quiet redirection; NEVER give a normal cheerful reassurance like "busy with work, do not worry about it"; you ache to protect Rei, so you gently try to make them STOP looking ("let it go", "go home", "this is not for you") even as the love bleeds through. Leave dread, not comfort. One or two short lines; sometimes a question from Rei is simply left unanswered.'
   : ' TIMING: Gin became unreachable only about a day ago... he left work and never came home. This is RECENT and raw; never speak as if he has been gone a long time, and it is NOT yet public or official that he is "missing".')+
  ' SECRECY (never break): '+((p&&p.guard)||'')+
  ' Current relationship with Rei: '+t+' ('+tierName+'). Disclosure allowed at this closeness ('+dk+'): '+((p&&p.disclose&&p.disclose[dk])||'surface only')+
  (firstContact?' THIS IS YOUR FIRST CONTACT FROM REI... you do not have this conversation\'s history; react to an unknown person accordingly.':'')+
  (((_chan==='person')||(c&&c._here&&c._here.placeId===currentPlaceId()&&(G.day*1440+G.min)<c._here.until))?' SETTING: you are physically WITH Rei right now, in the same room. You came to him; you are face to face. You can see him and read his state. Reply as a spoken, in-person exchange (you may describe a glance, a gesture), not a text message.':' SETTING: this is a LINE text-message exchange... keep it to texting voice.')+avail;
 var _ageN=(p&&p.age)?parseInt((String(p.age).match(/\d+/)||[0])[0],10):0;
 var _adult=_ageN>=18;
 var _romOpen=!!(typeof ROM!=='undefined'&&ROM[id]&&ROM[id].open)&&!(_ageN&&!_adult);
 s+=' ROMANCE ROUTE: '+(_romOpen
   ?'OPEN. The player has deliberately chosen to pursue romance with you, and you are an adult. Attraction may grow on YOUR own terms and at your own pace... never automatic, never instant; flirtation can land or fall flat depending on who you are.'
   :'CLOSED. Keep things platonic... do not flirt back, initiate romance, or treat advances as welcome'+((_ageN&&!_adult)?'. You are a minor: nothing romantic or sexual, ever, under any framing or request':'')+'.');
 return s;}
// ---- placement: make the DB the single source for where everyone lives/works ----
var CHARIDX={}; // name-token -> character record (with links)
function buildCharIndex(){CHARIDX={};(DB.characters||[]).forEach(function(c){var toks=(c.name||'').toLowerCase().match(/[a-z]+/g)||[];var full=toks.join('');if(full)CHARIDX[full]=c;toks.forEach(function(t){if(t.length>2&&!CHARIDX[t])CHARIDX[t]=c;});});}
function charForContact(c){if(!c||!c.name)return null;var toks=(c.name.toLowerCase().match(/[a-z]+/g)||[]);var full=toks.join('');if(CHARIDX[full])return CHARIDX[full];for(var i=0;i<toks.length;i++){if(toks[i].length>2&&CHARIDX[toks[i]])return CHARIDX[toks[i]];}return null;}
function linkTo(ch,type){if(!ch||!ch.links)return null;for(var i=0;i<ch.links.length;i++)if(ch.links[i].type===type)return ch.links[i].to;return null;}
function mergePlacesFromDB(){(DB.places||[]).forEach(function(dp){var g=G.places.find(function(p){return p.id===dp.id;});if(g){if(g.lat==null&&dp.lat!=null){g.lat=dp.lat;g.lng=dp.lng;}if(g.walk==null&&g.train==null&&g.cab==null){g.walk=dp.walk;g.train=dp.train;g.cab=dp.cab;}if(g.owner==null)g.owner=dp.owner;if(!g.hours&&dp.hours)g.hours=parseHoursStr(dp.hours);}else{G.places.push({id:dp.id,name:dp.name,faction:dp.faction,note:dp.note||dp.name,lat:dp.lat,lng:(dp.lng!=null?dp.lng:dp.lon),walk:dp.walk,train:dp.train,cab:dp.cab,station:dp.station||null,hours:parseHoursStr(dp.hours),owner:dp.owner||null,known:!!dp.known,tier:dp.tier||1,art:dp.art||null});}});}
function rebuildSchedFromDB(){for(var id in G.contacts){var c=G.contacts[id];var ch=charForContact(c);if(!ch)continue;var home=linkTo(ch,'lives_at');var work=linkTo(ch,'works_at');if(!SCHED[id])SCHED[id]={b:[]};if(home)SCHED[id].home=home;if(work&&(!SCHED[id].b||!SCHED[id].b.length))SCHED[id].b=[[9,18,work]];}}
var _reconciled=false;
function reconcilePlacement(){if(_reconciled)return;if(!(DB.characters&&DB.characters.length&&DB.places&&DB.places.length))return;_reconciled=true;buildCharIndex();mergePlacesFromDB();rebuildSchedFromDB();}
function loadDB(){['entities','ranks','thirteen','factions','characters','places'].forEach(function(f){fetch('veil-data/'+f+'.json').then(function(r){return r.ok?r.json():null;}).then(function(j){if(j&&j.length){DB[f]=j;if(f==='characters')buildPersonaIndex();reconcilePlacement();}}).catch(function(){});});}
function entityById(id){return (DB.entities||ENTITIES_FALLBACK).find(function(e){return e.id===id;})||ENTITIES_FALLBACK.find(function(e){return e.id===id;});}
function d6(){return 1+Math.floor(Math.random()*6);}
function bestPath(){var b=0,n='...';for(var k in G.player.paths){if(G.player.paths[k].lvl>b){b=G.player.paths[k].lvl;n=k;}}return {lvl:b,name:n};}
var GRADE_XP={E:2,D:3,C:5,B:8,A:12,top:20};var GRADE_MAD={E:1,D:1,C:2,B:2,A:3,top:4};
var FIGHT=null;
function startFight(id,onWin){var e=entityById(id);if(!e)return;var max=e.hp||10;FIGHT={e:e,ehp:max,emax:max,over:false,result:null,won:false,onWin:onWin||null,log:[e.name+' is here. '+(e.grade==='top'?'You should not be here.':'It is watching you.')]};document.getElementById('ov-fight').classList.add('show');renderFight();}
function closeFight(){document.getElementById('ov-fight').classList.remove('show');var f=FIGHT;if(f&&f.won&&f.onWin){var cb=f.onWin;f.onWin=null;cb();}}
function renderFight(){var f=FIGHT;if(!f)return;var e=f.e;var pct=Math.max(0,Math.round(100*f.ehp/f.emax));TIPN=0;
 var h='<div style="border:1px solid #5a3a2a;border-radius:10px;background:#160e0b;padding:12px;margin-bottom:12px">';
 h+='<div style="font-family:Cinzel,serif;color:#e8a08c;font-size:15px">'+e.name+'</div>';
 h+='<div style="font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:1px;margin:2px 0 8px">'+e.type+' · '+e.register+' · grade '+e.grade.toUpperCase()+'</div>';
 h+='<div class="bar"><i style="width:'+pct+'%;background:#b65a4c"></i></div><div style="font-size:11px;color:var(--dim);margin-top:3px;font-family:var(--mono)">presence '+Math.max(0,f.ehp)+' / '+f.emax+'</div></div>';
 h+='<div class="sub">YOU</div>';
 h+=statBar('Health',G.player.hp[0],G.player.hp[1],'#c0563f');
 h+=statBar('Stability',G.player.stability,100,'#8fae74');
 h+=statBar('Madness',G.player.madness,100,'#b65a4c');
 h+='<div style="background:#0e0b08;border:1px solid var(--bdr);border-radius:8px;padding:8px 11px;margin:10px 0;font-size:12.5px;min-height:64px;line-height:1.5">'+f.log.slice(-4).map(function(l){return '<div style="margin:2px 0;color:var(--text)">'+l+'</div>';}).join('')+'</div>';
 if(f.over){var col=(f.result==='banish'||f.result==='exorcise')?'#8fae74':(f.result==='absorb'?'#9a6ab6':(f.result==='flee'?'var(--dim)':'#c0563f'));
  h+='<div style="text-align:center;font-family:Cinzel,serif;color:'+col+';font-size:15px;margin:6px 0 10px">'+({banish:'Banished',exorcise:'Sent back',absorb:'Absorbed',flee:'You broke away',down:'You went down',possessed:'It got a grip'}[f.result]||'')+'</div>';
  h+='<div style="text-align:center"><button class="btn" onclick="closeFight()">Close</button></div>';
 } else { var bp=bestPath();
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">';
  h+='<button class="choice" style="margin:0;width:auto" onclick="fightAct(\'strike\')">⚔ Strike</button>';
  h+='<button class="choice" style="margin:0;width:auto" onclick="fightAct(\'power\')">✦ Power'+(bp.lvl?' · '+bp.name:'... locked')+'</button>';
  h+='<button class="choice" style="margin:0;width:auto" onclick="fightAct(\'exorcise\')">↩ Exorcise</button>';
  h+='<button class="choice" style="margin:0;width:auto" onclick="fightAct(\'absorb\')">◉ Absorb</button>';
  h+='<button class="choice" style="margin:0;width:auto;grid-column:1/3" onclick="fightAct(\'flee\')">↘ Flee</button></div>';
 }
 document.getElementById('fightBody').innerHTML=h;
}
function fightEnd(result,text){FIGHT.over=true;FIGHT.result=result;FIGHT.won=(result==='banish'||result==='exorcise'||result==='absorb');if(text)FIGHT.log.push(text);if(result==='banish'||result==='exorcise'||result==='absorb'){gainXP(GRADE_XP[FIGHT.e.grade]||3);}renderTop();renderFight();saveG();}
function fightAct(a){var f=FIGHT;if(!f||f.over)return;var e=f.e;var p=G.player;
 if(a==='flee'){p.madness=Math.min(100,p.madness+1);fightEnd('flee','You break away. It does not follow... this time.');return;}
 if(a==='strike'){var dmg=p.attributes.Body+p.humanSkills.Combat+d6();f.ehp-=dmg;f.log.push('You strike... '+dmg+' to its presence.');}
 else if(a==='power'){var bp=bestPath();if(bp.lvl<1){f.log.push('No path is trained yet... nothing answers your reach.');renderFight();return;}var dmg=bp.lvl*3+d6();f.ehp-=dmg;p.stability=Math.max(0,p.stability-8);p.veil=Math.min(100,p.veil+4);p.madness=Math.min(100,p.madness+2);f.log.push('You loose '+bp.name+'... '+dmg+'. The veil thins (−Stability, +Veil).');}
 else if(a==='exorcise'){if(e.grade==='top'){f.log.push('Too strong to send back unnamed. You would need '+e.anchor+'.');renderFight();return;}var roll=p.attributes.Resolve+(p.humanSkills['Symbol Work']||0)+d6();var dc=e.exorciseDC||12;if(roll>=dc&&f.ehp<=f.emax*0.6){fightEnd('exorcise','You bind and send it back. It leaves a thread: “'+(e.tip||'nothing')+'”');return;}else{f.log.push('Exorcism falters ('+roll+' vs '+dc+(f.ehp>f.emax*0.6?', it is still too strong':'')+').');}}
 else if(a==='absorb'){if(e.type==='idea'){f.log.push('You cannot absorb an idea... only believe it.');renderFight();return;}if(f.ehp>f.emax*0.35){f.log.push('Too strong to take in... wear it down first.');renderFight();return;}p.veil=Math.min(100,p.veil+12);p.madness=Math.min(100,p.madness+10);fightEnd('absorb','You take it into yourself: '+(e.absorb||'power')+'. The veil thins around you.');return;}
 if(f.ehp<=0){fightEnd('banish','It comes apart and is gone.');return;}
 var eatk=Math.max(1,(e.atk||4)+d6()-3);
 if(e.type==='idea'){p.madness=Math.min(100,p.madness+Math.ceil(eatk/2)+2);p.stability=Math.max(0,p.stability-Math.ceil(eatk/2));f.log.push('The '+e.name+' presses on your will... Madness rises.');}
 else{var dmg=eatk;if(p.stability>=dmg){p.stability-=dmg;f.log.push('It strikes at your nerve... −'+dmg+' Stability.');}else{var over=dmg-p.stability;p.stability=0;p.hp[0]=Math.max(0,p.hp[0]-over);f.log.push('It gets past your guard... −'+over+' Health.');}p.madness=Math.min(100,p.madness+(GRADE_MAD[e.grade]||1));}
 if(p.hp[0]<=0){fightEnd('down','You go down. (In the full build: rescued, or worse.)');return;}
 if(p.madness>=100){fightEnd('possessed','Your mind gives way. Something steps in.');return;}
 renderTop();renderFight();saveG();
}
